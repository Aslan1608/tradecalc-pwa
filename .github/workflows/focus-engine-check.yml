name: Focus Engine Check

on:
  pull_request:
    paths:
      - 'focus-engine.js'
      - 'focus-quality-v2.js'
      - 'focus-menu.js'
      - 'focus-explainability-v2.js'
      - 'focus-list-v2.js'
      - 'focus-list-semantics-v2.js'
      - 'focus-decision-v2.js'
      - 'focus-universe.json'
      - 'stock-financials-recovery.js'
      - 'stock-event-integrity.js'
      - 'news-directness-v1.js'
      - 'senseis-version.js'
      - 'sw.js'
      - 'tests/focus-engine.test.cjs'
      - 'tests/focus-semantics-v2.test.cjs'
      - '.github/workflows/focus-engine-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check focus-engine.js
          node --check focus-quality-v2.js
          node --check focus-menu.js
          node --check focus-explainability-v2.js
          node --check focus-list-v2.js
          node --check focus-list-semantics-v2.js
          node --check focus-decision-v2.js
          node --check stock-financials-recovery.js
          node --check stock-event-integrity.js
          node --check news-directness-v1.js
          node --check senseis-version.js
          node --check sw.js
      - name: Fixture tests
        run: |
          node tests/focus-engine.test.cjs
          node tests/focus-semantics-v2.test.cjs
      - name: Universe JSON check
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('focus-universe.json','utf8'));
          const symbols=(data.tickers||[]).map(x=>x.symbol);
          if(symbols.length!==16)throw new Error(`expected 16 focus-universe values, got ${symbols.length}`);
          if(new Set(symbols).size!==symbols.length)throw new Error('duplicate focus-universe symbols');
          console.log('focus-universe.json valid with 16 unique values');
          NODE
