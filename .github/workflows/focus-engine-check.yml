name: Focus Engine Check

on:
  pull_request:
    paths:
      - 'focus-engine.js'
      - 'focus-menu.js'
      - 'focus-explainability.js'
      - 'focus-universe.json'
      - 'senseis-version.js'
      - 'sw.js'
      - 'tests/focus-engine.test.cjs'
      - 'tests/focus-explainability.test.cjs'
      - '.github/workflows/focus-engine-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check focus-engine.js
          node --check focus-menu.js
          node --check focus-explainability.js
          node --check senseis-version.js
          node --check sw.js
      - name: Fixture tests
        run: |
          node tests/focus-engine.test.cjs
          node tests/focus-explainability.test.cjs
      - name: Universe JSON check
        run: node -e "JSON.parse(require('fs').readFileSync('focus-universe.json','utf8')); console.log('focus-universe.json valid')"
