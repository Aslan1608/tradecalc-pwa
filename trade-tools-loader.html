<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>SenSeiS Trade Tools</title>
<style>html,body{margin:0;min-height:100%;background:#050607;color:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.load strong{font-size:18px}.load span{display:block;color:#8c95a3;font-size:12px;margin-top:8px}</style>
</head>
<body>
<div class="load"><div><strong>Trade Workspace wird geladen …</strong><span>Stabiler TradingView Workspace · Livekurs · Events</span></div></div>
<script>
(()=>{
  const BUILD='20260803-0031-stable';
  fetch('./index-core.html?build='+BUILD,{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
    .then(html=>{
      html=html.replace(/src=["']\.\/calculator\.html\?v=[^"']+["']/, 'src="./calculator-events.html?v=events3-'+BUILD+'"');
      html=html.replace(/src=["']\.\/screenshot-import\.html\?v=[^"']+["']/, 'src="./screenshot-import.html?v=45-'+BUILD+'"');
      document.open();document.write(html);document.close();
    })
    .catch(error=>{
      document.body.innerHTML='<div class="load"><div><strong>Trade Workspace konnte nicht geladen werden.</strong><span>'+String(error.message||error)+'</span></div></div>';
    });
})();
</script>
</body>
</html>
