<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c10">
<title>TradeCalc</title>
<style>html,body{margin:0;min-height:100%;background:#090c10;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.load strong{font-size:18px}.load span{display:block;color:#8e99a8;font-size:12px;margin-top:8px}</style>
</head>
<body><div class="load"><div><strong>TradeCalc wird geladen …</strong><span>V4.6 · Stock Intelligence</span></div></div>
<script>
fetch('./index-core.html?v=shell1',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
 .then(html=>{
   html=html.replace('./calculator.html?v=45','./calculator.html?v=events1');
   html=html.replace('<title>TradeCalc V4.5</title>','<title>TradeCalc V4.6 Events</title>');
   html=html.replace('<span class="version">V4.5</span>','<span class="version">V4.6 EVENTS</span>');
   document.open();document.write(html);document.close();
 })
 .catch(e=>{document.body.innerHTML='<div class="load"><div><strong>TradeCalc konnte nicht geladen werden.</strong><span>'+String(e.message||e)+'</span></div></div>'});
</script></body></html>
