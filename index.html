<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeCalc">
<title>TradeCalc V4.4</title>
<style>
:root{--bg:#090c10;--panel:#111720;--line:#27303b;--text:#f4f7fb;--muted:#8e99a8;--blue:#4da3ff;--green:#30d158;--red:#ff453a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}body{background:radial-gradient(circle at top right,rgba(77,163,255,.11),transparent 35%),var(--bg)}.shell{height:100dvh;display:flex;flex-direction:column}.top{padding:max(10px,env(safe-area-inset-top)) 12px 9px;background:rgba(9,12,16,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);z-index:10}.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 3px 9px}.brand-left{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:rgba(77,163,255,.12);border:1px solid rgba(77,163,255,.32);font-size:18px}.brand h1{font-size:20px;line-height:1;margin:0;letter-spacing:-.035em}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.version{color:var(--blue);font-size:10px;font-weight:900;border:1px solid rgba(77,163,255,.32);background:rgba(77,163,255,.08);padding:6px 8px;border-radius:999px;white-space:nowrap}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tab{min-height:43px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;font-weight:900}.tab.active{border-color:rgba(77,163,255,.55);background:rgba(77,163,255,.12);color:#fff}.import-chip{display:none;margin-top:7px;padding:7px 10px;border-radius:10px;border:1px solid rgba(48,209,88,.26);background:rgba(48,209,88,.07);color:var(--green);font-size:11px;font-weight:800}.import-chip.show{display:block}.stage{position:relative;flex:1;min-height:0}.view{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}.view.active{display:block}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,18px);z-index:99;max-width:calc(100% - 28px);padding:11px 15px;border-radius:13px;background:#17251d;border:1px solid rgba(48,209,88,.38);color:var(--green);font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">
      <div class="brand-left"><div class="logo">📈</div><div><h1>TradeCalc</h1><small id="subtitle">Pre-Trade Cockpit</small></div></div>
      <span class="version">V4.4</span>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabCalc" class="tab active" type="button">🧮 Rechner</button>
      <button id="tabImport" class="tab" type="button">📸 Screenshot Import</button>
    </div>
    <div id="importChip" class="import-chip"></div>
  </div>
  <div class="stage">
    <iframe id="calcFrame" class="view active" src="./calculator.html?v=44" title="TradeCalc Rechner"></iframe>
    <iframe id="importFrame" class="view" src="./screenshot-import.html?v=44" title="TradingView Screenshot Import"></iframe>
  </div>
</div>
<div id="toast" class="toast">✓ Trade wurde übernommen</div>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),calc=$("calcFrame"),imp=$("importFrame");let pending=null;
function selectTab(name){const isCalc=name==="calc";$("tabCalc").classList.toggle("active",isCalc);$("tabImport").classList.toggle("active",!isCalc);calc.classList.toggle("active",isCalc);imp.classList.toggle("active",!isCalc);$("subtitle").textContent=isCalc?"Pre-Trade Cockpit":"TradingView-Erkennung";try{sessionStorage.setItem("tradecalc-tab",name)}catch{}}
function fire(el,type){el&&el.dispatchEvent(new Event(type,{bubbles:true}))}
function metaCard(doc,p){let card=doc.getElementById("tradecalcImportMeta");if(!card){card=doc.createElement("section");card.id="tradecalcImportMeta";card.className="card";card.style.cssText="border-color:rgba(48,209,88,.3);background:linear-gradient(145deg,rgba(48,209,88,.08),rgba(20,26,34,.96));";const header=doc.querySelector("main.app header");if(header)header.insertAdjacentElement("afterend",card)}if(card)card.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><div style="font-size:11px;color:#30d158;font-weight:900;margin-bottom:4px">✓ TRADINGVIEW IMPORT</div><strong style="font-size:16px">'+p.symbol+' · '+p.timeframe+' · '+p.side.toUpperCase()+'</strong></div><div style="font-size:11px;color:#8e99a8;text-align:right">CRV<br><strong style="color:#30d158">'+p.rr+'</strong></div></div>'}
function applyImport(p){let doc;try{doc=calc.contentDocument}catch{return false}if(!doc||!doc.getElementById("entry"))return false;const stock=doc.getElementById("stock");if(stock){const exists=[...stock.options].some(o=>o.value===p.symbol);if(exists){stock.value=p.symbol;fire(stock,"change")}}
  const sideButton=doc.getElementById(p.side==="short"?"short":"long");if(sideButton)sideButton.click();
  [["entry",p.entry],["sl",p.sl],["tp",p.tp]].forEach(([id,value])=>{const el=doc.getElementById(id);if(el){el.value=value;fire(el,"input");fire(el,"change")}});
  metaCard(doc,p);try{localStorage.setItem("tradecalc-last-import",JSON.stringify(p))}catch{}
  $("importChip").textContent="✓ Importiert: "+p.symbol+" · "+p.timeframe+" · "+p.side.toUpperCase()+" · Entry "+p.entry;$("importChip").classList.add("show");selectTab("calc");setTimeout(()=>{try{doc.getElementById("entry").scrollIntoView({behavior:"smooth",block:"center"})}catch{}},180);showToast();return true}
function showToast(){const t=$("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900)}
$("tabCalc").addEventListener("click",()=>selectTab("calc"));$("tabImport").addEventListener("click",()=>selectTab("import"));
window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==imp.contentWindow||e.data?.type!=="TRADECALC_IMPORT")return;pending=e.data.payload;if(applyImport(pending))pending=null});
calc.addEventListener("load",()=>{if(pending&&applyImport(pending))pending=null});
let initial="calc";try{initial=sessionStorage.getItem("tradecalc-tab")||"calc"}catch{}selectTab(initial);
})();
</script>
</body>
</html>
