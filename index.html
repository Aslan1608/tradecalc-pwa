<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SenSeiS"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-180.png"><title>SenSeiS Terminal</title><style>html,body{margin:0;min-height:100%;background:#050607;color:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.load strong{font-size:18px}.load span{display:block;color:#8c95a3;font-size:11px;margin-top:7px}</style><script src="./senseis-version.js"></script></head>

 })
