<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>SenSeiS Trade Calculator</title>
<style>html,body{margin:0;min-height:100%;background:#050607;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.load strong{font-size:18px}.load span{display:block;color:#8e99a8;font-size:12px;margin-top:8px}</style>
</head>
<body><div class="load"><div><strong>Trade Calculator wird geladen …</strong><span>Fester TradingView Workspace · kein Layout-Rückfall</span></div></div>
<script>
(()=>{
  const BUILD='20260803-0058-static-workspace';
  const workspaceCss=`
  .app{max-width:1380px!important}
  .app>header,.app>section:not(.senseis-market-row),.app>.heroes,.app>p.note{width:100%;max-width:680px;margin-left:auto!important;margin-right:auto!important}
  .senseis-market-row{display:flex;align-items:stretch;margin:0 auto 14px;width:100%;min-width:0}
  .senseis-market-row>.card.live,.senseis-tv-card{flex:0 0 auto;min-width:0;margin:0!important}
  .senseis-market-row>.card.live{height:auto;overflow:auto}
  .senseis-tv-card{position:relative;background:#0d1014;border:1px solid #343c48;border-radius:19px;padding:15px 15px 18px;overflow:hidden;min-height:450px}
  .senseis-tv-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:11px}
  .senseis-tv-head h2{margin:0;font-size:17px;color:#f7f8fa}
  .senseis-tv-head p{margin:4px 0 0;color:#8c95a3;font-size:11px}
  .senseis-tv-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .senseis-tv-symbol{padding:6px 9px;border:1px solid #343c48;border-radius:999px;background:#12161c;color:#f7f8fa;font-size:10px;font-weight:900}
  .senseis-layout-btn{width:32px;height:32px;border:1px solid #343c48;border-radius:9px;background:#12161c;color:#f7f8fa;font-weight:900;cursor:pointer}
  .senseis-layout-btn:hover{border-color:#f7f8fa}
  .senseis-tv-mount{position:relative;height:calc(100% - 94px);min-height:358px;border:1px solid #252b34;border-radius:13px;overflow:hidden;background:#050607}
  .senseis-tv-mount .tradingview-widget-container,.senseis-tv-mount .tradingview-widget-container__widget{height:100%!important;width:100%!important}
  .senseis-tv-loading{position:absolute;inset:0;z-index:0;display:grid;place-items:center;padding:20px;text-align:center;color:#8c95a3;font-size:12px;background:#050607}
  .senseis-tv-loading[data-kind="error"]{color:#ff9f0a}
  .senseis-tv-note{margin:8px 2px 0;color:#8c95a3;font-size:10px;line-height:1.35}
  .senseis-splitter{flex:0 0 14px;position:relative;cursor:col-resize;touch-action:none}
  .senseis-splitter:before{content:'';position:absolute;left:5px;top:18px;bottom:18px;width:4px;border-radius:99px;background:#252b34;transition:.15s}
  .senseis-splitter:hover:before,.senseis-splitter.dragging:before{background:#f7f8fa}
  .senseis-height-handle{position:absolute;left:18%;right:18%;bottom:3px;height:10px;cursor:row-resize;touch-action:none}
  .senseis-height-handle:before{content:'';position:absolute;left:35%;right:35%;top:3px;height:3px;border-radius:99px;background:#343c48}
  .senseis-height-handle:hover:before,.senseis-height-handle.dragging:before{background:#f7f8fa}
  .senseis-layout-help{position:absolute;right:14px;bottom:6px;color:#626c79;font-size:9px;pointer-events:none}
  @media(max-width:900px){.app{max-width:680px!important}.senseis-market-row{display:flex;flex-direction:column!important;gap:14px}.senseis-market-row>.card.live,.senseis-tv-card{width:100%!important;flex-basis:auto!important}.senseis-market-row>.card.live{order:1!important}.senseis-tv-card{order:2!important;height:500px!important}.senseis-splitter,.senseis-height-handle,.senseis-layout-help,.senseis-layout-btn.swap{display:none!important}.senseis-tv-mount{min-height:390px}}
  @media(max-width:430px){.senseis-tv-card{padding:12px;height:450px!important}.senseis-tv-mount{min-height:340px}}
  `;
  fetch('./calculator-core.html?build='+BUILD,{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
    .then(source=>{
      const doc=new DOMParser().parseFromString(source,'text/html');
      const style=doc.createElement('style');style.id='senseisStaticWorkspaceStyle';style.textContent=workspaceCss;doc.head.appendChild(style);
      const pre=doc.createElement('script');pre.src='./market-feed.js?v=4-static';doc.head.appendChild(pre);
      const live=doc.querySelector('.card.live');
      if(!live)throw new Error('LIVE_CARD_NOT_FOUND');
      const marketRow=doc.createElement('section');marketRow.className='senseis-market-row';marketRow.id='senseisMarketRow';
      const split=doc.createElement('div');split.className='senseis-splitter';split.id='senseisMarketSplitter';
      const chart=doc.createElement('section');chart.className='senseis-tv-card';chart.innerHTML='<div class="senseis-tv-head"><div><h2>TradingView Chart</h2><p>GETTEX Intraday · fest im Workspace verankert</p></div><div class="senseis-tv-actions"><span id="senseisTvSymbol" class="senseis-tv-symbol">—</span><button id="senseisSwapLayout" class="senseis-layout-btn swap" title="Chart und Livekurs tauschen">⇄</button><button id="senseisResetLayout" class="senseis-layout-btn" title="Layout zurücksetzen">↺</button></div></div><div id="senseisTvMount" class="senseis-tv-mount"><div id="senseisTvLoading" class="senseis-tv-loading" data-kind="loading">TradingView wird geladen …</div></div><p class="senseis-tv-note">Chart: GETTEX für Intraday. Referenzkurs: Google/Xetra. Langsames TradingView-Laden verändert die Seitenstruktur nicht mehr.</p><div id="senseisHeightHandle" class="senseis-height-handle" title="Ziehen, um die Höhe zu ändern"></div><span class="senseis-layout-help">Trenner/Höhe ziehen</span>';
      live.replaceWith(marketRow);marketRow.appendChild(live);marketRow.appendChild(split);marketRow.appendChild(chart);
      const scripts=['market-feed-compat.js?v=3-static','index-universe.js?v=4-static','earnings-module.js?v=4-static','stock-intelligence-embed.js?v=3-static','tradingview-workspace-static.js?v=1'];
      scripts.forEach(src=>{const s=doc.createElement('script');s.src='./'+src;doc.body.appendChild(s)});
      document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();
    })
    .catch(e=>{document.body.innerHTML='<div class="load"><div><strong>Trade Calculator konnte nicht geladen werden.</strong><span>'+String(e.message||e)+'</span></div></div>'});
})();
</script></body></html>
