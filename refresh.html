<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>SenSeiS Terminal aktualisieren</title>
<style>html,body{margin:0;min-height:100%;background:#050607;color:#f7f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);border:1px solid #29303a;border-radius:20px;background:#0d1014;padding:22px}.ey{font-size:10px;font-weight:900;letter-spacing:.13em;color:#8c95a3}.title{font-size:24px;font-weight:900;margin:8px 0}.msg{font-size:13px;line-height:1.55;color:#aab2bf}.ok{color:#30d158}.err{color:#ff6961}</style>
</head>
<body><div class="wrap"><div class="card"><div class="ey">SENSEIS TERMINAL</div><div class="title">Update wird erzwungen …</div><div id="msg" class="msg">Alter SenSeiS-PWA-Cache und Service Worker werden entfernt.</div></div></div>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/tradecalc-pwa/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('senseis-pwa-')).map(k=>caches.delete(k)));
    }
    try{sessionStorage.removeItem('senseis-view')}catch{}
    msg.className='msg ok';
    msg.textContent='SenSeiS-Cache gelöscht. Foundation 5.5.1 wird jetzt frisch geladen.';
    setTimeout(()=>location.replace('./?fresh=foundation-5-5-1-'+Date.now()),450);
  }catch(error){
    msg.className='msg err';
    msg.textContent='Automatisches Bereinigen fehlgeschlagen: '+String(error?.message||error);
  }
})();
</script></body></html>
