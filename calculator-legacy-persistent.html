<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c10">
<title>SenSeiS Legacy TradeCalc</title>
<style>html,body{margin:0;min-height:100%;background:#090c10;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.load strong{font-size:18px}.load span{display:block;color:#8e99a8;font-size:12px;margin-top:8px}</style>
</head>
<body>
<div class="load"><div><strong>Legacy TradeCalc wird geladen …</strong><span>TradingView · DAX/S&amp;P 500 · Finnhub + Google Feed</span></div></div>
<script>
(()=>{
  const BUILD='20260805-legacy-persistent-1';
  fetch('./calculator.html?build='+BUILD,{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
    .then(html=>{
      const vault='<script src="./finnhub-key-vault.js?v=2"><\/script>';
      html=html.includes('</head>')?html.replace('</head>',vault+'</head>'):vault+html;
      document.open();document.write(html);document.close();
    })
    .catch(error=>{document.body.innerHTML='<div class="load"><div><strong>Legacy TradeCalc konnte nicht geladen werden.</strong><span>'+String(error.message||error)+'</span></div></div>'});
})();
</script>
</body>
</html>
