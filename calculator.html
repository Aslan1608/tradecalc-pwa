<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>SenSeiS Trade Calculator</title>
<style>html,body{margin:0;min-height:100%;background:#050607;color:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.load strong{font-size:18px}.load span{display:block;color:#8e99a8;font-size:12px;margin-top:8px}</style>
</head>
<body><div class="load"><div><strong>Trade Calculator wird geladen …</strong><span>Index-Universum · Rechner · Event Risk</span></div></div>
<script>
fetch('./calculator-core.html?v=core1',{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
 .then(html=>{
   const addons='<script src="./index-universe.js?v=1"><\/script><script src="./earnings-module.js?v=2"><\/script>';
   html=html.includes('</body>')?html.replace('</body>',addons+'</body>'):html+addons;
   document.open();document.write(html);document.close();
 })
 .catch(e=>{document.body.innerHTML='<div class="load"><div><strong>Trade Calculator konnte nicht geladen werden.</strong><span>'+String(e.message||e)+'</span></div></div>'});
</script></body></html>
